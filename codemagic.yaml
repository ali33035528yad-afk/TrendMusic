workflows:
  trendmusic-android:
    name: TrendMusic Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Extract TrendMusic project
        script: |
          set -e
          rm -rf build_project
          unzip -q TrendMusic-Fixed.zip -d build_project

      - name: Set Android SDK location
        script: |
          set -e
          cd build_project/trendmusic
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Gradle 8.9
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          rm -f gradle.zip

      - name: Fix TrendMusic source
        script: |
          set -e
          cd build_project/trendmusic

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/trendmusic/app/MainActivity.kt")
          s = p.read_text()

          s = s.replace(
              "NavigationBarItemDefaults.colors(",
              "androidx.compose.material3.NavigationBarItemDefaults.colors("
          )

          s = s.replace(
              "NavigationBarItem(",
              "androidx.compose.material3.NavigationBarItem("
          )

          s = s.replace(
              "verticalScroll(",
              "androidx.compose.foundation.verticalScroll("
          )

          p.write_text(s)
          PY

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Build Android debug APK
        script: |
          set -e
          cd build_project/trendmusic
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" assembleDebug

    artifacts:
      - build_project/trendmusic/app/build/outputs/**/*.apk
